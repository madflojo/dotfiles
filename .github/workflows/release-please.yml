name: Skill releases

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundary:
    name: Verify release activation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the import boundary
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          const config = JSON.parse(readFileSync('release-please-config.json'));
          const sha = config['bootstrap-sha'];
          assert(/^[a-f0-9]{40}$/.test(sha) && !/^0+$/.test(sha), 'Set the merged import SHA before activation');
          execFileSync('git', ['merge-base', '--is-ancestor', sha, 'HEAD']);
          JS
  release:
    name: Release Please
    needs: boundary
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
