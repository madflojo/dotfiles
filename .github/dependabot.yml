version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      validation-tools:
        patterns:
          - '*'
  - package-ecosystem: npm
    directory: /.github/commitlint
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      commitlint:
        patterns:
          - '*'
